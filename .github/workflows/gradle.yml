name: Java CI

on: [push, pull_request]

jobs:
  build:
    name: build (${{ matrix.platform }}${{ matrix.java-package == 'jdk+fx' && ', JDK+FX 25' || '' }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        java-package: [jdk]
        include:
          # Also test the course's Mac setup with its bundled JavaFX 25.
          - platform: macos-latest
            java-package: jdk+fx
            java-version: '25.0.3'
            architecture: aarch64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory:  ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version || '25' }}
          # Plain JDK jobs use Gradle's JavaFX 17.0.7 dependencies.
          java-package: ${{ matrix.java-package }}
          # JavaFX 17's packaged native libraries target x64.
          architecture: ${{ matrix.architecture || 'x64' }}

      - name: Start a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Build and check with Gradle
        timeout-minutes: 15
        run: ./gradlew check coverage

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
